<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Equus Momentum - Vanguard Access</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* RESET & BASE */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Courier New', Courier, monospace; /* Fonte Tática/Terminal */
      background-color: #050505; 
      color: #a1a1aa; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      padding: 20px;
    }

    /* THE CARD (Tactical Panel) */
    .container { 
      max-width: 500px; 
      width: 100%;
      background: #0f0f11; 
      border: 1px solid #333;
      border-left: 4px solid #D4AF37; /* Gold Accent on left */
      border-radius: 4px; /* Cantos mais retos */
      padding: 40px; 
      position: relative;
    }

    /* STATUS INDICATOR */
    .status-badge {
      display: inline-block;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #10b981; /* Green */
      background: rgba(16, 185, 129, 0.1);
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 20px;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    h1 { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 24px; 
      font-weight: 700; 
      color: #fff; 
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }
    
    p { 
      font-size: 14px; 
      line-height: 1.6; 
      margin-bottom: 32px;
    }

    /* THE BUTTON (Ghost Style) */
    .btn { 
      display: block; 
      width: 100%;
      background: transparent;
      color: #D4AF37; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: 1px solid #D4AF37; 
      border-radius: 4px; 
      padding: 16px; 
      font-size: 13px; 
      cursor: pointer; 
      text-decoration: none; 
      text-align: center;
      transition: all 0.3s ease;
    }

    .btn:hover { 
      background: rgba(212, 175, 55, 0.1); 
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
    }

    .footer {
      margin-top: 30px;
      font-size: 11px;
      opacity: 0.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="status-badge">● Clearance Approved</div>
    <h1>Welcome to the Vanguard.</h1>
    <p>
      This is the backstage. You have been selected to operate within our inner circle. 
      <br><br>
      Sync your comms channel below to receive your <strong>Vanguard Role</strong> and access the Battle Kit.
    </p>

    <a href="https://discord.com/oauth2/authorize?client_id=1420522348271894578&response_type=code&redirect_uri=https%3A%2F%2Fdiscord-login-59lx.onrender.com%2Fcallback-affiliate&scope=identify+guilds.join" class="btn">
      Initialize Sync [Discord]
    </a>

    <div class="footer">
      Equus Momentum • Internal Operations
    </div>
  </div>
</body>
</html>
